<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eterion - Gestor de Combate</title>
    <link rel="icon" type="image/png" href="IMG/logo.png">
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --color-fondo: #0f0f0f;
            --color-texto: #ffffff;
            --color-texto-suave: rgba(255, 255, 255, 0.5);
            --color-texto-tenue: rgba(255, 255, 255, 0.35);
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--color-fondo);
            transition: background-color 0.3s ease;
            color: var(--color-texto);
            display: flex;
            flex-direction: column;
        }

        .logo {
            position: absolute;
            top: 0.1rem;
            left: 0.1rem;
            width: 6rem;
            max-width: 30vw;
            height: auto;
            z-index: 5;
        }

        .copyright {
            position: fixed;
            bottom: 0.75rem;
            right: 1rem;
            font-size: 0.7rem;
            color: var(--color-texto-tenue);
            transition: color 0.3s ease;
            z-index: 5;
        }

        .selector-color {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 20;
        }

        .boton-color {
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.4),
                0 6px 18px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .boton-color:hover {
            background-color: rgba(255, 255, 255, 0.14);
            transform: scale(1.05);
        }

        .boton-color svg {
            width: 1.25rem;
            height: 1.25rem;
            stroke: var(--color-texto);
            transition: stroke 0.3s ease;
        }

        .paleta {
            position: absolute;
            top: 3.5rem;
            right: 0;
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.6rem;
            padding: 1rem;
            border-radius: 1.1rem;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.4),
                0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .paleta.abierta {
            display: grid;
        }

        .swatch {
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .swatch:hover {
            transform: scale(1.15);
        }

        .swatch.activo {
            border-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3);
        }

        .pantalla-preparacion,
        .pantalla-combate {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .barra-turno {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.75rem 0 0;
        }

        .barra-turno span {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--color-texto-suave);
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: rgba(255, 255, 255, 0.06);
        }

        .bando {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5rem 2rem 1.5rem;
            position: relative;
        }

        .pantalla-preparacion .bando {
            padding-top: 3.5rem;
        }

        .bando-a {
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .bando-titulo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            text-align: center;
            margin: 0 0 1.25rem;
            color: var(--color-texto-suave);
        }

        .bando-contenido {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-content: flex-start;
            justify-content: center;
        }

        .personaje {
            width: 14rem;
            padding: 1.1rem 1.25rem;
            border-radius: 1.1rem;
            background-color: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.35),
                0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .personaje-combate {
            width: 15.5rem;
        }

        .personaje-nombre {
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            margin: 0 0 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .personaje-stat {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 0.2rem 0;
            color: var(--color-texto-suave);
        }

        .personaje-stat strong {
            color: var(--color-texto);
            font-weight: 600;
            cursor: default;
        }

        .personaje-stat strong.buff-positivo {
            color: #5b9dff;
        }

        .personaje-stat strong.buff-negativo {
            color: #ff5c5c;
        }

        .vida-bloque {
            margin: 0.6rem 0 0.4rem;
        }

        .vida-barra-fondo {
            width: 100%;
            height: 0.5rem;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .vida-barra-relleno {
            height: 100%;
            border-radius: 999px;
            background-color: #ff5c5c;
            transition: width 0.3s ease;
        }

        .vida-texto {
            margin: 0.35rem 0 0;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .pendientes {
            text-align: center;
            font-size: 0.72rem;
            margin: 0.15rem 0 0;
            min-height: 0.9rem;
        }

        .pendientes .dano {
            color: #ff8080;
        }

        .pendientes .curacion {
            color: #7bd88f;
        }

        .badges-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin: 0.5rem 0;
            min-height: 0.1rem;
        }

        .badge-efecto,
        .badge-buff {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            cursor: default;
        }

        .badge-efecto.negativo {
            color: #ff8080;
            border-color: rgba(255, 128, 128, 0.4);
        }

        .badge-buff.positivo {
            color: #5b9dff;
            border-color: rgba(91, 157, 255, 0.4);
        }

        .badge-buff.negativo {
            color: #ff8080;
            border-color: rgba(255, 128, 128, 0.4);
        }

        .badge-efecto small,
        .badge-buff small {
            opacity: 0.7;
        }

        .quitar-badge {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 0.85rem;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            opacity: 0.6;
        }

        .quitar-badge:hover {
            opacity: 1;
        }

        .acciones-personaje {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .acciones-personaje .btn-accion.btn-cargas {
            grid-column: 1 / -1;
        }

        .btn-accion {
            padding: 0.4rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--color-texto);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-accion:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .btn-accion.activo {
            background-color: rgba(255, 204, 51, 0.2);
            border-color: rgba(255, 204, 51, 0.5);
        }

        .panel-accion {
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.6rem;
            padding: 0.75rem;
            border-radius: 0.8rem;
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .panel-accion label {
            font-size: 0.7rem;
            color: var(--color-texto-tenue);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .panel-accion input,
        .panel-accion select {
            width: 100%;
            padding: 0.4rem 0.55rem;
            border-radius: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--color-texto);
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
        }

        .panel-accion select option {
            background-color: #1c1c1e;
            color: #ffffff;
        }

        .control-numero {
            display: flex;
            align-items: stretch;
            gap: 0.4rem;
        }

        .control-numero input {
            text-align: center;
        }

        .control-numero button {
            width: 2rem;
            border-radius: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-texto);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .control-numero button:hover {
            background-color: rgba(255, 255, 255, 0.18);
        }

        .control-numero.pequeno {
            width: auto;
        }

        .control-numero.pequeno button {
            width: 1.5rem;
            font-size: 0.85rem;
        }

        .control-numero.pequeno span.valor-carga {
            min-width: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .btn-anadir-carga {
            width: 100%;
            padding: 0.5rem;
            border-radius: 999px;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--color-texto);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-anadir-carga:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .form-nueva-carga {
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.6rem;
            padding: 0.65rem;
            border-radius: 0.7rem;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .titulo-cargas-actuales {
            margin: 0.75rem 0 0.35rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--color-texto-tenue);
        }

        .lista-cargas {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .fila-carga {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            gap: 0.5rem;
        }

        .fila-carga span.nombre-carga {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sin-cargas {
            font-size: 0.78rem;
            color: var(--color-texto-tenue);
        }

        .tarjeta-anadir {
            width: 14rem;
            border-radius: 1.1rem;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1.5px dashed rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 4.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--color-texto-suave);
            padding: 1rem;
            text-align: center;
        }

        .tarjeta-anadir:hover {
            background-color: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--color-texto);
        }

        .tarjeta-anadir.abierto {
            cursor: default;
            width: 16rem;
            padding: 1.25rem;
            border-style: solid;
            background-color: rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
            align-items: stretch;
        }

        .tarjeta-anadir.abierto .texto-inicial {
            display: none;
        }

        .campo-formulario label {
            display: block;
            font-size: 0.72rem;
            color: var(--color-texto-tenue);
            margin-bottom: 0.25rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .campo-formulario input,
        .campo-formulario select {
            width: 100%;
            padding: 0.5rem 0.6rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--color-texto);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
        }

        .campo-formulario select option {
            background-color: #1c1c1e;
            color: #ffffff;
        }

        .acciones-formulario {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.35rem;
        }

        .btn-confirmar,
        .btn-cancelar {
            flex: 1;
            padding: 0.5rem;
            border-radius: 0.6rem;
            border: none;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.1s ease;
        }

        .btn-confirmar {
            background-color: #ffcc33;
            color: #1a1400;
        }

        .btn-cancelar {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-texto);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-confirmar:hover,
        .btn-cancelar:hover {
            filter: brightness(1.1);
        }

        .btn-confirmar:active,
        .btn-cancelar:active {
            transform: scale(0.97);
        }

        .btn-flotante {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.9rem 1.75rem;
            border-radius: 999px;
            border: none;
            background-color: #ffcc33;
            color: #1a1400;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow:
                0 4px 14px rgba(255, 204, 51, 0.35),
                0 2px 6px rgba(0, 0, 0, 0.3);
            transition: filter 0.15s ease, transform 0.1s ease;
            z-index: 10;
        }

        .btn-flotante:hover {
            filter: brightness(1.08);
        }

        .btn-flotante:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <img src="IMG/logo.png" alt="Logo" class="logo">

    <div class="selector-color">
        <button class="boton-color" id="botonColor" aria-label="Elegir color de fondo" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 6l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 9l4.37-4.37a1 1 0 0 0 0-1.41l-1.59-1.59a1 1 0 0 0-1.41 0Z" />
                <path d="M9 8c-2 3-4 3.5-7 4l8 8c.5-3 1-5 4-7" />
                <path d="M14.5 17.5 4.5 20.5" />
            </svg>
        </button>

        <div class="paleta" id="paleta">
            <div class="swatch activo" style="background:#0f0f0f" data-color="#0f0f0f"></div>
            <div class="swatch" style="background:#1c1c1e" data-color="#1c1c1e"></div>
            <div class="swatch" style="background:#2c2c2e" data-color="#2c2c2e"></div>
            <div class="swatch" style="background:#3a3a3c" data-color="#3a3a3c"></div>
            <div class="swatch" style="background:#0a3d62" data-color="#0a3d62"></div>
            <div class="swatch" style="background:#1e3a5f" data-color="#1e3a5f"></div>
            <div class="swatch" style="background:#3d0a3d" data-color="#3d0a3d"></div>
            <div class="swatch" style="background:#3d1a0a" data-color="#3d1a0a"></div>
            <div class="swatch" style="background:#0a3d1f" data-color="#0a3d1f"></div>
            <div class="swatch" style="background:#3d0a0a" data-color="#3d0a0a"></div>
            <div class="swatch" style="background:#fdf6b2" data-color="#fdf6b2" data-texto="#000000"></div>
            <div class="swatch" style="background:#7b113a" data-color="#7b113a"></div>
            <div class="swatch" style="background:#da7756" data-color="#da7756" data-texto="#000000"></div>
            <div class="swatch" style="background:#f7c6d9" data-color="#f7c6d9" data-texto="#000000"></div>
            <div class="swatch" style="background:#ffffff" data-color="#ffffff" data-texto="#000000"></div>
        </div>
    </div>

    <div class="pantalla-preparacion" id="pantallaPreparacion">
        <div class="bando bando-a">
            <p class="bando-titulo">Bando 1</p>
            <div class="bando-contenido" id="contenedorBandoA"></div>
        </div>

        <div class="bando bando-b">
            <p class="bando-titulo">Bando 2</p>
            <div class="bando-contenido" id="contenedorBandoB"></div>
        </div>
    </div>

    <button class="btn-flotante" id="btnEmpezar" type="button">Empezar partida</button>

    <div class="pantalla-combate" id="pantallaCombate" style="display:none">
        <div class="barra-turno">
            <span id="textoTurno">Turno 1</span>
        </div>

        <div class="bando bando-a">
            <p class="bando-titulo">Bando 1</p>
            <div class="bando-contenido" id="contenedorCombateA"></div>
        </div>

        <div class="bando bando-b">
            <p class="bando-titulo">Bando 2</p>
            <div class="bando-contenido" id="contenedorCombateB"></div>
        </div>
    </div>

    <button class="btn-flotante" id="btnSiguienteTurno" type="button" style="display:none">Siguiente turno →</button>

    <p class="copyright">© 2026 Eterion - Todos los derechos reservados.</p>

    <script>
        // ==================================================================
        // DATOS
        // ==================================================================
        let contadorId = 0;
        let turnoActual = 1;
        const bandoA = [];
        const bandoB = [];

        function todosLosPersonajes() {
            return bandoA.concat(bandoB);
        }

        function buscarPersonaje(id) {
            return todosLosPersonajes().find((p) => p.id === id);
        }

        // ==================================================================
        // OPCIONES DE ESTADÍSTICA (Bajo...LB+18) Y CONVERSIÓN NUMÉRICA
        // ==================================================================
        function generarOpcionesEstadistica() {
            const niveles = ['Bajo', 'Medio', 'Alto', 'Avanzado', 'Maestro', 'LB'];
            for (let i = 1; i <= 18; i++) {
                niveles.push(`LB+${i}`);
            }
            return niveles;
        }
        const OPCIONES_ESTADISTICA = generarOpcionesEstadistica();
        const NIVELES_BASE = ['Bajo', 'Medio', 'Alto', 'Avanzado', 'Maestro', 'LB'];

        function nivelANumero(label) {
            const idx = OPCIONES_ESTADISTICA.indexOf(label);
            return idx >= 0 ? idx + 1 : 1;
        }

        function numeroANivel(valor) {
            valor = Math.max(1, Math.round(valor));
            if (valor <= 6) return NIVELES_BASE[valor - 1];
            return `LB+${valor - 6}`;
        }

        // Vida inicial según la Resistencia BASE (sin buffs): Bajo=9, Medio=12, Alto=15...
        function hpDesdeResistencia(labelResistencia) {
            return 3 * nivelANumero(labelResistencia) + 6;
        }

        function crearSelectEstadistica(id) {
            const opciones = OPCIONES_ESTADISTICA
                .map((nivel) => `<option value="${nivel}">${nivel}</option>`)
                .join('');
            return `<select id="${id}">${opciones}</select>`;
        }

        function escapeHTML(texto) {
            const div = document.createElement('div');
            div.textContent = texto;
            return div.innerHTML;
        }

        function capitalizar(texto) {
            return texto.charAt(0).toUpperCase() + texto.slice(1);
        }

        function nombrePorId(id, lista) {
            const encontrado = lista.find((p) => p.id === id);
            return encontrado ? encontrado.nombre : 'Desconocido';
        }

        // Delta total (buffs + cargas ligadas) sobre una estadística
        function statDelta(p, stat) {
            const buffsDelta = p.buffs.filter((b) => b.stat === stat).reduce((s, b) => s + b.valor, 0);
            const cargasDelta = p.cargas
                .filter((c) => c.involucraStat && c.stat === stat)
                .reduce((s, c) => s + c.cantidad * c.escala, 0);
            return buffsDelta + cargasDelta;
        }

        function statTotal(p, stat) {
            const base = nivelANumero(p[stat]);
            return Math.max(1, base + statDelta(p, stat));
        }

        // ==================================================================
        // FASE DE PREPARACIÓN: tarjeta "+ Añadir personaje"
        // ==================================================================
        function crearTarjetaAnadir(idBando, arrayDatos) {
            const div = document.createElement('div');
            div.className = 'tarjeta-anadir';
            div.dataset.bando = idBando;

            const sufijo = idBando + '-' + Date.now() + '-' + Math.random().toString(36).slice(2);

            div.innerHTML = `
                <span class="texto-inicial">+ Añadir personaje</span>
                <div class="formulario-personaje" style="display:none; width:100%;">
                    <div class="campo-formulario">
                        <label>Nombre</label>
                        <input type="text" class="campo-nombre" placeholder="Nombre del personaje">
                    </div>
                    <div class="campo-formulario">
                        <label>Fuerza</label>
                        ${crearSelectEstadistica('campo-fuerza-' + sufijo)}
                    </div>
                    <div class="campo-formulario">
                        <label>Intel</label>
                        ${crearSelectEstadistica('campo-intel-' + sufijo)}
                    </div>
                    <div class="campo-formulario">
                        <label>Resistencia</label>
                        ${crearSelectEstadistica('campo-resistencia-' + sufijo)}
                    </div>
                    <div class="campo-formulario">
                        <label>Velocidad</label>
                        ${crearSelectEstadistica('campo-velocidad-' + sufijo)}
                    </div>
                    <div class="acciones-formulario">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                        <button type="button" class="btn-confirmar">Añadir personaje</button>
                    </div>
                </div>
            `;

            div.addEventListener('click', () => {
                if (!div.classList.contains('abierto')) {
                    div.classList.add('abierto');
                    const form = div.querySelector('.formulario-personaje');
                    form.style.display = 'flex';
                    form.style.flexDirection = 'column';
                    form.style.gap = '0.65rem';
                }
            });

            div.querySelector('.btn-cancelar').addEventListener('click', (e) => {
                e.stopPropagation();
                cerrarFormulario(div);
            });

            div.querySelector('.btn-confirmar').addEventListener('click', (e) => {
                e.stopPropagation();

                const nombre = div.querySelector('.campo-nombre').value.trim();
                const selects = div.querySelectorAll('select');

                if (!nombre) {
                    alert('Por favor, introduce un nombre para el personaje.');
                    return;
                }

                const resistenciaBase = selects[2].value;
                const vidaInicial = hpDesdeResistencia(resistenciaBase);

                const datos = {
                    id: 'p' + (contadorId++),
                    bando: idBando,
                    nombre,
                    fuerza: selects[0].value,
                    intel: selects[1].value,
                    resistencia: resistenciaBase,
                    velocidad: selects[3].value,
                    vidaMaxima: vidaInicial, // fijada al crear el personaje, no se recalcula con buffs
                    vidaActual: vidaInicial,
                    efectos: [], // { texto, turnos, fuenteId }
                    buffs: [], // { stat, valor, turnos, fuenteId }
                    cargas: [], // { nombre, involucraStat, stat, escala, cantidad }
                    pendienteDano: [], // { cantidad, tipo }
                    pendienteCuracion: [], // { cantidad }
                    danoResidual: [], // { cantidad, turnos, fuenteId }
                    panelAbierto: null,
                    formCargaAbierto: false,
                };

                arrayDatos.push(datos);

                const contenedor = div.parentElement;
                const tarjetaPersonaje = crearTarjetaPersonajePrep(datos);
                contenedor.insertBefore(tarjetaPersonaje, div);

                cerrarFormulario(div);
            });

            return div;
        }

        function cerrarFormulario(div) {
            div.classList.remove('abierto');
            div.querySelector('.formulario-personaje').style.display = 'none';
            div.querySelector('.campo-nombre').value = '';
            div.querySelectorAll('select').forEach((s) => (s.selectedIndex = 0));
        }

        function crearTarjetaPersonajePrep(datos) {
            const div = document.createElement('div');
            div.className = 'personaje';
            div.dataset.id = datos.id;
            div.innerHTML = `
                <p class="personaje-nombre">${escapeHTML(datos.nombre)}</p>
                <div class="personaje-stat"><span>Fuerza</span><strong>${datos.fuerza}</strong></div>
                <div class="personaje-stat"><span>Intel</span><strong>${datos.intel}</strong></div>
                <div class="personaje-stat"><span>Resistencia</span><strong>${datos.resistencia}</strong></div>
                <div class="personaje-stat"><span>Velocidad</span><strong>${datos.velocidad}</strong></div>
                <div class="personaje-stat"><span>Vida inicial</span><strong>${datos.vidaMaxima}</strong></div>
            `;
            return div;
        }

        const contenedorA = document.getElementById('contenedorBandoA');
        const contenedorB = document.getElementById('contenedorBandoB');

        contenedorA.appendChild(crearTarjetaAnadir('a', bandoA));
        contenedorB.appendChild(crearTarjetaAnadir('b', bandoB));

        // ==================================================================
        // FASE DE COMBATE
        // ==================================================================
        const pantallaPreparacion = document.getElementById('pantallaPreparacion');
        const pantallaCombate = document.getElementById('pantallaCombate');
        const btnEmpezar = document.getElementById('btnEmpezar');
        const btnSiguienteTurno = document.getElementById('btnSiguienteTurno');
        const textoTurno = document.getElementById('textoTurno');
        const contenedorCombateA = document.getElementById('contenedorCombateA');
        const contenedorCombateB = document.getElementById('contenedorCombateB');

        btnEmpezar.addEventListener('click', () => {
            pantallaPreparacion.style.display = 'none';
            btnEmpezar.style.display = 'none';
            pantallaCombate.style.display = 'flex';
            btnSiguienteTurno.style.display = 'block';
            renderCombate();
        });

        function renderCombate() {
            const todos = todosLosPersonajes();
            contenedorCombateA.innerHTML = bandoA.map((p) => tarjetaCombateHTML(p, todos)).join('');
            contenedorCombateB.innerHTML = bandoB.map((p) => tarjetaCombateHTML(p, todos)).join('');
        }

        function opcionesFuenteHTML(todos, seleccionadoId) {
            return todos
                .map(
                    (o) =>
                        `<option value="${o.id}" ${o.id === seleccionadoId ? 'selected' : ''}>${escapeHTML(o.nombre)}</option>`
                )
                .join('');
        }

        function statConColorHTML(p, stat) {
            const delta = statDelta(p, stat);
            const totalLabel = numeroANivel(statTotal(p, stat));
            const claseColor = delta > 0 ? 'buff-positivo' : delta < 0 ? 'buff-negativo' : '';
            const titulo = `Original: ${p[stat]} (${delta >= 0 ? '+' : ''}${delta})`;
            return `<strong class="${claseColor}" title="${escapeHTML(titulo)}">${totalLabel}</strong>`;
        }

        function listaCargasHTML(p) {
            if (p.cargas.length === 0) {
                return `<p class="sin-cargas">Todavía no hay cargas registradas.</p>`;
            }
            return p.cargas
                .map(
                    (c, i) => `
                <div class="fila-carga">
                    <span class="nombre-carga">${escapeHTML(c.nombre)}${c.involucraStat ? ` <small>(${capitalizar(c.stat)} x${c.escala})</small>` : ''}</span>
                    <div class="control-numero pequeno">
                        <button type="button" data-action="carga-decrementar" data-id="${p.id}" data-index="${i}">−</button>
                        <span class="valor-carga">${c.cantidad}</span>
                        <button type="button" data-action="carga-incrementar" data-id="${p.id}" data-index="${i}">+</button>
                    </div>
                </div>`
                )
                .join('');
        }

        function tarjetaCombateHTML(p, todos) {
            const efectosHTML = p.efectos
                .map(
                    (ef, i) => `
                <span class="badge-efecto negativo" title="Aplicado por ${escapeHTML(nombrePorId(ef.fuenteId, todos))}">
                    <button type="button" class="quitar-badge" data-action="quitar-efecto" data-id="${p.id}" data-index="${i}">×</button>
                    ${escapeHTML(ef.texto)} <small>(${ef.turnos}t)</small>
                </span>`
                )
                .join('');

            const buffsHTML = p.buffs
                .map(
                    (b, i) => `
                <span class="badge-buff ${b.valor >= 0 ? 'positivo' : 'negativo'}" title="Aplicado por ${escapeHTML(nombrePorId(b.fuenteId, todos))}">
                    <button type="button" class="quitar-badge" data-action="quitar-buff" data-id="${p.id}" data-index="${i}">×</button>
                    ${capitalizar(b.stat)} ${b.valor >= 0 ? '+' : ''}${b.valor} <small>(${b.turnos}t)</small>
                </span>`
                )
                .join('');

            const residualHTML = p.danoResidual
                .map(
                    (d, i) => `
                <span class="badge-efecto negativo" title="Aplicado por ${escapeHTML(nombrePorId(d.fuenteId, todos))} — ignora mitigación de Resistencia">
                    <button type="button" class="quitar-badge" data-action="quitar-residual" data-id="${p.id}" data-index="${i}">×</button>
                    Daño residual: -${d.cantidad} <small>(${d.turnos}t)</small>
                </span>`
                )
                .join('');

            const opcionesFuente = opcionesFuenteHTML(todos);
            const porcentajeVida = Math.max(0, Math.min(100, (p.vidaActual / p.vidaMaxima) * 100));

            const mitigacion = statDelta(p, 'resistencia');
            const sumaPendienteDano = p.pendienteDano.reduce((s, d) => s + Math.max(0, d.cantidad - mitigacion), 0);
            const sumaPendienteCuracion = p.pendienteCuracion.reduce((s, c) => s + c.cantidad, 0);
            const pendientesHTML = `
                ${sumaPendienteDano > 0 ? `<div class="dano">Daño pendiente: -${sumaPendienteDano}${mitigacion !== 0 ? ' (tras mitigación)' : ''}</div>` : ''}
                ${sumaPendienteCuracion > 0 ? `<div class="curacion">Curación pendiente: +${sumaPendienteCuracion}</div>` : ''}
            `;

            return `
                <div class="personaje personaje-combate" data-id="${p.id}">
                    <p class="personaje-nombre">${escapeHTML(p.nombre)}</p>
                    <div class="personaje-stat"><span>Fuerza</span>${statConColorHTML(p, 'fuerza')}</div>
                    <div class="personaje-stat"><span>Intel</span>${statConColorHTML(p, 'intel')}</div>
                    <div class="personaje-stat"><span>Velocidad</span>${statConColorHTML(p, 'velocidad')}</div>
                    <div class="personaje-stat"><span>Resistencia</span>${statConColorHTML(p, 'resistencia')}</div>

                    <div class="vida-bloque">
                        <div class="vida-barra-fondo">
                            <div class="vida-barra-relleno" id="barra-vida-${p.id}" style="width:${porcentajeVida}%"></div>
                        </div>
                        <p class="vida-texto">
                            <span id="vida-actual-${p.id}">${p.vidaActual}</span>/<span>${p.vidaMaxima}</span>
                        </p>
                        <div class="pendientes" id="pendientes-${p.id}">${pendientesHTML}</div>
                    </div>

                    <div class="badges-contenedor" id="badges-${p.id}">${efectosHTML}${residualHTML}${buffsHTML}</div>

                    <div class="acciones-personaje">
                        <button type="button" class="btn-accion ${p.panelAbierto === 'dano' ? 'activo' : ''}" data-action="toggle-panel" data-id="${p.id}" data-tipo="dano">Daño</button>
                        <button type="button" class="btn-accion ${p.panelAbierto === 'curacion' ? 'activo' : ''}" data-action="toggle-panel" data-id="${p.id}" data-tipo="curacion">Curar</button>
                        <button type="button" class="btn-accion ${p.panelAbierto === 'efecto' ? 'activo' : ''}" data-action="toggle-panel" data-id="${p.id}" data-tipo="efecto">Efecto</button>
                        <button type="button" class="btn-accion ${p.panelAbierto === 'buff' ? 'activo' : ''}" data-action="toggle-panel" data-id="${p.id}" data-tipo="buff">Buff/Debuff</button>
                        <button type="button" class="btn-accion btn-cargas ${p.panelAbierto === 'cargas' ? 'activo' : ''}" data-action="toggle-panel" data-id="${p.id}" data-tipo="cargas">Cargas</button>
                    </div>

                    <div class="panel-accion" data-panel="dano" data-id="${p.id}" style="display:${p.panelAbierto === 'dano' ? 'flex' : 'none'}">
                        <label>Fuente</label>
                        <select id="select-fuente-dano-${p.id}" data-action="auto-dano" data-id="${p.id}">${opcionesFuente}</select>
                        <label>Naturaleza</label>
                        <select id="select-naturaleza-dano-${p.id}" data-action="auto-dano" data-id="${p.id}">
                            <option value="fisico">Físico (usa Fuerza)</option>
                            <option value="magico">Mágico (usa Intel)</option>
                        </select>
                        <label>Cantidad de daño</label>
                        <div class="control-numero">
                            <button type="button" data-action="decrementar" data-target="input-dano-${p.id}">−</button>
                            <input type="number" id="input-dano-${p.id}" value="0" min="0">
                            <button type="button" data-action="incrementar" data-target="input-dano-${p.id}">+</button>
                        </div>
                        <label>Tipo de daño</label>
                        <select id="select-tipo-dano-${p.id}" data-action="toggle-turnos-residual" data-id="${p.id}">
                            <option value="normal">Normal</option>
                            <option value="castigo">Castigo (x2)</option>
                            <option value="extincion">Extinción</option>
                            <option value="corrosion">Corrosión</option>
                            <option value="residual">Residual (ignora mitigación)</option>
                        </select>
                        <div id="bloque-turnos-residual-${p.id}" style="display:none">
                            <label>Turnos de daño residual</label>
                            <input type="number" id="input-turnos-dano-${p.id}" value="1" min="1">
                        </div>
                        <button type="button" class="btn-confirmar" data-action="preparar-dano" data-id="${p.id}">Poner daño en cola</button>
                    </div>

                    <div class="panel-accion" data-panel="curacion" data-id="${p.id}" style="display:${p.panelAbierto === 'curacion' ? 'flex' : 'none'}">
                        <label>Cantidad de curación</label>
                        <div class="control-numero">
                            <button type="button" data-action="decrementar" data-target="input-curacion-${p.id}">−</button>
                            <input type="number" id="input-curacion-${p.id}" value="0" min="0">
                            <button type="button" data-action="incrementar" data-target="input-curacion-${p.id}">+</button>
                        </div>
                        <button type="button" class="btn-confirmar" data-action="preparar-curacion" data-id="${p.id}">Poner curación en cola</button>
                    </div>

                    <div class="panel-accion" data-panel="efecto" data-id="${p.id}" style="display:${p.panelAbierto === 'efecto' ? 'flex' : 'none'}">
                        <label>Efecto</label>
                        <input type="text" id="input-texto-efecto-${p.id}" placeholder="Nombre del efecto">
                        <label>Turnos</label>
                        <input type="number" id="input-turnos-efecto-${p.id}" value="1" min="1">
                        <label>Fuente</label>
                        <select id="select-fuente-efecto-${p.id}">${opcionesFuente}</select>
                        <button type="button" class="btn-confirmar" data-action="aplicar-efecto" data-id="${p.id}">Añadir efecto</button>
                    </div>

                    <div class="panel-accion" data-panel="buff" data-id="${p.id}" style="display:${p.panelAbierto === 'buff' ? 'flex' : 'none'}">
                        <label>Estadística</label>
                        <select id="select-stat-buff-${p.id}">
                            <option value="fuerza">Fuerza</option>
                            <option value="intel">Intel</option>
                            <option value="resistencia">Resistencia</option>
                            <option value="velocidad">Velocidad</option>
                        </select>
                        <label>Valor (+/-)</label>
                        <div class="control-numero">
                            <button type="button" data-action="decrementar" data-target="input-valor-buff-${p.id}" data-sin-min="true">−</button>
                            <input type="number" id="input-valor-buff-${p.id}" value="0">
                            <button type="button" data-action="incrementar" data-target="input-valor-buff-${p.id}">+</button>
                        </div>
                        <label>Turnos</label>
                        <input type="number" id="input-turnos-buff-${p.id}" value="1" min="1">
                        <label>Fuente</label>
                        <select id="select-fuente-buff-${p.id}">${opcionesFuente}</select>
                        <button type="button" class="btn-confirmar" data-action="aplicar-buff" data-id="${p.id}">Añadir buff/debuff</button>
                    </div>

                    <div class="panel-accion" data-panel="cargas" data-id="${p.id}" style="display:${p.panelAbierto === 'cargas' ? 'flex' : 'none'}">
                        <button type="button" class="btn-anadir-carga" data-action="toggle-form-carga" data-id="${p.id}">+ Añadir carga</button>

                        <div class="form-nueva-carga" id="form-carga-${p.id}" style="display:${p.formCargaAbierto ? 'flex' : 'none'}">
                            <label>Nombre de la carga</label>
                            <input type="text" id="input-nombre-carga-${p.id}" placeholder="Nombre de la carga">
                            <label>¿Involucra alguna estadística?</label>
                            <select id="select-involucra-carga-${p.id}" data-action="toggle-stat-carga" data-id="${p.id}">
                                <option value="no">No</option>
                                <option value="si">Sí</option>
                            </select>
                            <div id="bloque-stat-carga-${p.id}" style="display:none">
                                <label>Estadística</label>
                                <select id="select-stat-carga-${p.id}">
                                    <option value="fuerza">Fuerza</option>
                                    <option value="intel">Intel</option>
                                    <option value="resistencia">Resistencia</option>
                                    <option value="velocidad">Velocidad</option>
                                </select>
                                <label>Escala</label>
                                <select id="select-escala-carga-${p.id}">
                                    <option value="1">Relación 1-1 (cada carga +1)</option>
                                    <option value="2">Relación 1-2 (cada carga +2)</option>
                                </select>
                            </div>
                            <button type="button" class="btn-confirmar" data-action="crear-carga" data-id="${p.id}">Añadir carga</button>
                        </div>

                        <p class="titulo-cargas-actuales">Cargas actuales</p>
                        <div class="lista-cargas" id="lista-cargas-${p.id}">
                            ${listaCargasHTML(p)}
                        </div>
                    </div>
                </div>
            `;
        }

        function actualizarVisualTarjeta(p) {
            const todos = todosLosPersonajes();
            const tarjetaActual = document.querySelector(`.personaje-combate[data-id="${p.id}"]`);
            if (tarjetaActual) {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = tarjetaCombateHTML(p, todos).trim();
                tarjetaActual.replaceWith(wrapper.firstElementChild);
            }
        }

        function actualizarPanelesTarjeta(p) {
            document.querySelectorAll(`[data-panel][data-id="${p.id}"]`).forEach((panel) => {
                panel.style.display = panel.dataset.panel === p.panelAbierto ? 'flex' : 'none';
            });
            document.querySelectorAll(`.btn-accion[data-id="${p.id}"]`).forEach((btn) => {
                btn.classList.toggle('activo', btn.dataset.tipo === p.panelAbierto);
            });
        }

        // ---------- Lógica de las acciones ----------
        function prepararDano(p, cantidad, tipo, turnosResidual, fuenteId) {
            if (cantidad <= 0) return;

            if (tipo === 'residual') {
                p.danoResidual.push({ cantidad, turnos: Math.max(1, turnosResidual), fuenteId });
            } else {
                const cantidadFinal = tipo === 'castigo' ? cantidad * 2 : cantidad;
                p.pendienteDano.push({ cantidad: cantidadFinal, tipo });
            }

            p.panelAbierto = null;
            actualizarVisualTarjeta(p);
        }

        function prepararCuracion(p, cantidad) {
            if (cantidad <= 0) return;
            p.pendienteCuracion.push({ cantidad });
            p.panelAbierto = null;
            actualizarVisualTarjeta(p);
        }

        function añadirEfecto(p, texto, turnos, fuenteId) {
            if (!texto.trim()) return;
            p.efectos.push({ texto: texto.trim(), turnos: Math.max(1, turnos), fuenteId });
            p.panelAbierto = null;
            actualizarVisualTarjeta(p);
        }

        function añadirBuff(p, stat, valor, turnos, fuenteId) {
            if (valor === 0) return;
            p.buffs.push({ stat, valor, turnos: Math.max(1, turnos), fuenteId });
            p.panelAbierto = null;
            actualizarVisualTarjeta(p);
        }

        function quitarEfecto(p, index) {
            p.efectos.splice(index, 1);
            actualizarVisualTarjeta(p);
        }

        function quitarBuff(p, index) {
            p.buffs.splice(index, 1);
            actualizarVisualTarjeta(p);
        }

        function quitarResidual(p, index) {
            p.danoResidual.splice(index, 1);
            actualizarVisualTarjeta(p);
        }

        function crearCarga(p, nombre, involucraStat, stat, escala) {
            if (!nombre.trim()) return;
            p.cargas.push({
                nombre: nombre.trim(),
                involucraStat,
                stat: involucraStat ? stat : null,
                escala: involucraStat ? escala : 1,
                cantidad: 1,
            });
            p.formCargaAbierto = false;
            actualizarVisualTarjeta(p);
        }

        function ajustarCarga(p, index, delta) {
            const carga = p.cargas[index];
            if (!carga) return;
            carga.cantidad = Math.max(0, carga.cantidad + delta);
            actualizarVisualTarjeta(p);
        }

        // ---------- Pasar de turno: aplica lo pendiente y baja duraciones ----------
        function pasarTurno() {
            todosLosPersonajes().forEach((p) => {
                // La Resistencia mitiga daño normal/castigo/extinción/corrosión,
                // pero NO el daño residual (que ignora buffs de Resistencia).
                const mitigacion = statDelta(p, 'resistencia');
                const sumaDano = p.pendienteDano.reduce(
                    (s, d) => s + Math.max(0, d.cantidad - mitigacion),
                    0
                );
                const sumaCuracion = p.pendienteCuracion.reduce((s, c) => s + c.cantidad, 0);
                const sumaResidual = p.danoResidual.reduce((s, d) => s + d.cantidad, 0);

                p.vidaActual = Math.max(0, p.vidaActual - sumaDano - sumaResidual);
                p.vidaActual = Math.min(p.vidaMaxima, p.vidaActual + sumaCuracion);

                p.pendienteDano = [];
                p.pendienteCuracion = [];

                p.danoResidual = p.danoResidual
                    .map((d) => ({ ...d, turnos: d.turnos - 1 }))
                    .filter((d) => d.turnos > 0);

                p.efectos = p.efectos
                    .map((ef) => ({ ...ef, turnos: ef.turnos - 1 }))
                    .filter((ef) => ef.turnos > 0);

                p.buffs = p.buffs
                    .map((b) => ({ ...b, turnos: b.turnos - 1 }))
                    .filter((b) => b.turnos > 0);

                p.panelAbierto = null;
                p.formCargaAbierto = false;
            });

            turnoActual++;
            textoTurno.textContent = `Turno ${turnoActual}`;
            renderCombate();
        }

        btnSiguienteTurno.addEventListener('click', pasarTurno);

        // ---------- Delegación de eventos (clicks) ----------
        pantallaCombate.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const accion = btn.dataset.action;

            if (accion === 'toggle-panel') {
                const p = buscarPersonaje(btn.dataset.id);
                p.panelAbierto = p.panelAbierto === btn.dataset.tipo ? null : btn.dataset.tipo;
                actualizarPanelesTarjeta(p);
                return;
            }

            if (accion === 'incrementar' || accion === 'decrementar') {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                const delta = accion === 'incrementar' ? 1 : -1;
                const tieneMin = input.hasAttribute('min') && !btn.dataset.sinMin;
                const min = tieneMin ? Number(input.min) : -Infinity;
                input.value = Math.max(min, Number(input.value || 0) + delta);
                return;
            }

            if (accion === 'preparar-dano') {
                const p = buscarPersonaje(btn.dataset.id);
                const cantidad = Number(document.getElementById(`input-dano-${p.id}`).value) || 0;
                const tipo = document.getElementById(`select-tipo-dano-${p.id}`).value;
                const fuenteId = document.getElementById(`select-fuente-dano-${p.id}`).value;
                const inputTurnos = document.getElementById(`input-turnos-dano-${p.id}`);
                const turnosResidual = inputTurnos ? Number(inputTurnos.value) || 1 : 1;
                prepararDano(p, cantidad, tipo, turnosResidual, fuenteId);
                return;
            }

            if (accion === 'preparar-curacion') {
                const p = buscarPersonaje(btn.dataset.id);
                const cantidad = Number(document.getElementById(`input-curacion-${p.id}`).value) || 0;
                prepararCuracion(p, cantidad);
                return;
            }

            if (accion === 'aplicar-efecto') {
                const p = buscarPersonaje(btn.dataset.id);
                const texto = document.getElementById(`input-texto-efecto-${p.id}`).value;
                const turnos = Number(document.getElementById(`input-turnos-efecto-${p.id}`).value) || 1;
                const fuenteId = document.getElementById(`select-fuente-efecto-${p.id}`).value;
                añadirEfecto(p, texto, turnos, fuenteId);
                return;
            }

            if (accion === 'aplicar-buff') {
                const p = buscarPersonaje(btn.dataset.id);
                const stat = document.getElementById(`select-stat-buff-${p.id}`).value;
                const valor = Number(document.getElementById(`input-valor-buff-${p.id}`).value) || 0;
                const turnos = Number(document.getElementById(`input-turnos-buff-${p.id}`).value) || 1;
                const fuenteId = document.getElementById(`select-fuente-buff-${p.id}`).value;
                añadirBuff(p, stat, valor, turnos, fuenteId);
                return;
            }

            if (accion === 'quitar-efecto') {
                const p = buscarPersonaje(btn.dataset.id);
                quitarEfecto(p, Number(btn.dataset.index));
                return;
            }

            if (accion === 'quitar-buff') {
                const p = buscarPersonaje(btn.dataset.id);
                quitarBuff(p, Number(btn.dataset.index));
                return;
            }

            if (accion === 'quitar-residual') {
                const p = buscarPersonaje(btn.dataset.id);
                quitarResidual(p, Number(btn.dataset.index));
                return;
            }

            if (accion === 'toggle-form-carga') {
                const p = buscarPersonaje(btn.dataset.id);
                p.formCargaAbierto = !p.formCargaAbierto;
                actualizarVisualTarjeta(p);
                return;
            }

            if (accion === 'crear-carga') {
                const p = buscarPersonaje(btn.dataset.id);
                const nombre = document.getElementById(`input-nombre-carga-${p.id}`).value;
                const involucra = document.getElementById(`select-involucra-carga-${p.id}`).value === 'si';
                const stat = document.getElementById(`select-stat-carga-${p.id}`).value;
                const escala = Number(document.getElementById(`select-escala-carga-${p.id}`).value) || 1;
                crearCarga(p, nombre, involucra, stat, escala);
                return;
            }

            if (accion === 'carga-incrementar') {
                const p = buscarPersonaje(btn.dataset.id);
                ajustarCarga(p, Number(btn.dataset.index), 1);
                return;
            }

            if (accion === 'carga-decrementar') {
                const p = buscarPersonaje(btn.dataset.id);
                ajustarCarga(p, Number(btn.dataset.index), -1);
                return;
            }
        });

        // ---------- Delegación de eventos (cambios en selects) ----------
        pantallaCombate.addEventListener('change', (e) => {
            const autoDano = e.target.closest('[data-action="auto-dano"]');
            if (autoDano) {
                const id = autoDano.dataset.id;
                const fuenteId = document.getElementById(`select-fuente-dano-${id}`).value;
                const naturaleza = document.getElementById(`select-naturaleza-dano-${id}`).value;
                const fuente = buscarPersonaje(fuenteId);
                if (fuente) {
                    const valor = naturaleza === 'fisico' ? statTotal(fuente, 'fuerza') : statTotal(fuente, 'intel');
                    document.getElementById(`input-dano-${id}`).value = valor;
                }
                return;
            }

            const toggleResidual = e.target.closest('[data-action="toggle-turnos-residual"]');
            if (toggleResidual) {
                const id = toggleResidual.dataset.id;
                const bloque = document.getElementById(`bloque-turnos-residual-${id}`);
                bloque.style.display = toggleResidual.value === 'residual' ? 'block' : 'none';
                return;
            }

            const toggleStatCarga = e.target.closest('[data-action="toggle-stat-carga"]');
            if (toggleStatCarga) {
                const id = toggleStatCarga.dataset.id;
                const bloque = document.getElementById(`bloque-stat-carga-${id}`);
                bloque.style.display = toggleStatCarga.value === 'si' ? 'block' : 'none';
                return;
            }
        });

        // ==================================================================
        // SELECTOR DE COLOR
        // ==================================================================
        const botonColor = document.getElementById('botonColor');
        const paleta = document.getElementById('paleta');
        const swatches = document.querySelectorAll('.swatch');
        const raiz = document.documentElement;

        botonColor.addEventListener('click', (e) => {
            paleta.classList.toggle('abierta');
            e.stopPropagation();
        });

        swatches.forEach((swatch) => {
            swatch.addEventListener('click', () => {
                const color = swatch.dataset.color;
                const textoOscuro = swatch.dataset.texto === '#000000';

                raiz.style.setProperty('--color-fondo', color);

                if (textoOscuro) {
                    raiz.style.setProperty('--color-texto', '#000000');
                    raiz.style.setProperty('--color-texto-suave', 'rgba(0, 0, 0, 0.55)');
                    raiz.style.setProperty('--color-texto-tenue', 'rgba(0, 0, 0, 0.4)');
                } else {
                    raiz.style.setProperty('--color-texto', '#ffffff');
                    raiz.style.setProperty('--color-texto-suave', 'rgba(255, 255, 255, 0.5)');
                    raiz.style.setProperty('--color-texto-tenue', 'rgba(255, 255, 255, 0.35)');
                }

                swatches.forEach((s) => s.classList.remove('activo'));
                swatch.classList.add('activo');

                paleta.classList.remove('abierta');
            });
        });

        document.addEventListener('click', (e) => {
            if (!paleta.contains(e.target) && e.target !== botonColor) {
                paleta.classList.remove('abierta');
            }
        });
    </script>
</body>
